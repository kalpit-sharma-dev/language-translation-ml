<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Machine Translation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 Neural Machine Translation</h1>
            <p class="subtitle">Multilingual Translation using Transformer</p>
        </header>

        <main>
            <div class="language-selector">
                <label for="language-select">Translate to:</label>
                <select id="language-select">
                    {% if languages %}
                        {% for lang in languages %}
                        <option value="{{ lang.code }}">{{ lang.flag }} {{ lang.name }}</option>
                        {% endfor %}
                    {% else %}
                        <option value="">No languages available</option>
                    {% endif %}
                </select>
            </div>

            <div class="translation-box">
                <div class="input-section">
                    <label for="source-text">English Text:</label>
                    <textarea 
                        id="source-text" 
                        placeholder="Enter English text to translate..."
                        rows="6"
                    ></textarea>
                    <div class="controls">
                        <label for="beam-size">Beam Size:</label>
                        <select id="beam-size">
                            <option value="1">1 (Greedy)</option>
                            <option value="4" selected>4</option>
                            <option value="8">8</option>
                        </select>
                        <button id="translate-btn" class="btn-primary">Translate</button>
                        <button id="clear-btn" class="btn-secondary">Clear</button>
                    </div>
                </div>

                <div class="output-section">
                    <label for="target-text" id="target-label">Translation:</label>
                    <textarea 
                        id="target-text" 
                        placeholder="Translation will appear here (supports any language)..."
                        rows="6"
                        readonly
                    ></textarea>
                    <div class="status" id="status"></div>
                </div>
            </div>

            <div class="examples">
                <h3>Example Sentences:</h3>
                <div class="example-list">
                    <div class="example-item" data-text="Hello, how are you?">Hello, how are you?</div>
                    <div class="example-item" data-text="The weather is nice today.">The weather is nice today.</div>
                    <div class="example-item" data-text="I love learning new languages.">I love learning new languages.</div>
                    <div class="example-item" data-text="Can you help me with this problem?">Can you help me with this problem?</div>
                    <div class="example-item" data-text="Machine learning is fascinating.">Machine learning is fascinating.</div>
                </div>
            </div>
        </main>

        <footer>
            <p>Powered by Transformer-based Neural Machine Translation</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
