# Multilingual Transformer Configuration
# Supports: Hindi (hi), Bengali (bn), Telugu (te), Tamil (ta), Gujarati (gu), etc.

data:
  # Change these based on your language pair
  train_src: data/cleaned/train.en
  train_tgt: data/cleaned/train.hi  # Change to .bn, .te, .ta, .gu, etc.
  dev_src: data/cleaned/dev.en
  dev_tgt: data/cleaned/dev.hi
  test_src: data/cleaned/test.en
  test_tgt: data/cleaned/test.hi
  tokenizer_dir: data/tokenized
  joint_tokenizer: true
  max_len: 250
  source_lang: en
  target_lang: hi  # Options: hi, bn, te, ta, gu, kn, ml, mr, pa, ur

model:
  d_model: 512
  nhead: 8
  num_encoder_layers: 6
  num_decoder_layers: 6
  dim_feedforward: 2048
  dropout: 0.1

training:
  batch_size: 16
  num_epochs: 10
  lr: 5e-4
  warmup_steps: 400
  label_smoothing: 0.1
  clip_grad: 1.0
  eval_every: 1

checkpoint_dir: checkpoints
log_dir: logs

